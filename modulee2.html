<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎈</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: grid;
  place-items: center;
  font-family: Georgia, "Times New Roman", serif;
  color: #5d659b;
  background: linear-gradient(145deg, #f4fbff 0%, #e5f0ff 48%, #e9e2ff 100%);
}

.scene {
  z-index: 1;
  width: 100%;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  position: relative;
}

.content {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 400px;
  text-align: center;
}

h1 {
  font-size: clamp(25px, 6vw, 32px);
  font-weight: normal;
  margin: 0 0 8px;
}

.subtitle {
  color: #7c83ad;
  font-size: 14px;
  margin: 0;
}

.balloon-area {
  height: 260px;
  max-width: 350px;
  margin: 20px auto 5px;
  position: relative;
}

.message {
  position: absolute;
  z-index: 1;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: clamp(26px, 7vw, 35px);
  font-style: italic;
  font-weight: bold;
  line-height: 1.1;
}

.message span {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .5s ease, transform .5s ease;
}

.message span.revealed {
  opacity: 1;
  transform: translateY(0);
}

.balloon {
  --color: #a8ded8;
  position: absolute;
  width: 66px;
  height: 82px;
  border: 1px solid #ffffffd9;
  border-radius: 50%;
  background: var(--color);
  box-shadow: inset -8px -7px 0 #00000009, 0 8px 17px #b58c9b1c;
  cursor: pointer;
  padding: 0;
  z-index: 2;
  transform-origin: 50% 90%;
  animation: float 2.4s ease-in-out infinite alternate;
  -webkit-tap-highlight-color: transparent;
}

.balloon::before {
  content: "";
  position: absolute;
  top: 12px;
  left: 13px;
  width: 11px;
  height: 22px;
  border-radius: 50%;
  background: #ffffff8c;
  transform: rotate(24deg);
}

.balloon::after {
  content: "";
  position: absolute;
  left: 27px;
  bottom: -8px;
  border-left: 5px solid transparent;
  border-right: 5px solid transparent;
  border-top: 9px solid var(--color);
}

.string {
  position: absolute;
  left: 32px;
  top: 80px;
  height: 33px;
  width: 1px;
  background: #c6a9b3;
}

.balloon:nth-of-type(1) {
  left: calc(50% - 82px);
  top: 47px;
  --color: #a8ded8;
  animation-delay: -.3s;
}

.balloon:nth-of-type(2) {
  left: calc(50% + 10px);
  top: 43px;
  --color: #c8c0f5;
  animation-delay: -1.1s;
}

.balloon:nth-of-type(3) {
  left: calc(50% - 43px);
  top: 3px;
  --color: #f5b4c8;
  animation-delay: -.7s;
}

.balloon:nth-of-type(4) {
  left: calc(50% - 3px);
  top: 108px;
  --color: #f2d47a;
  animation-delay: -1.5s;
}

@keyframes float {
  to { translate: 0 -8px; rotate: 2deg; }
}

.balloon.popped {
  animation: pop .3s ease-in forwards;
  pointer-events: none;
}

@keyframes pop {
  30% { transform: scale(1.2); }
  100% { transform: scale(0); opacity: 0; }
}

/* After all balloons pop, show only the final message. */
body.finished .intro,
body.finished .balloon,
body.finished .heart {
  display: none;
}

body.finished .message {
  z-index: 2;
}

body.finished .balloon-area {
  height: 100vh;
  max-width: none;
  width: 100%;
  margin: 0;
  position: fixed;
  inset: 0;
}

body.finished .message {
  position: fixed;
  inset: 0;
  justify-content: center;
  font-size: clamp(30px, 8vw, 42px);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

.next-module {
  display: none;
  position: fixed;
  z-index: 10;
  left: 50%;
  bottom: max(22px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  border: 0;
  border-radius: 999px;
  padding: 14px 22px;
  background: #6976b8;
  color: #fff;
  font: 600 14px Arial, sans-serif;
  box-shadow: 0 8px 22px #6976b833;
  cursor: pointer;
  max-width: calc(100vw - 32px);
  white-space: nowrap;
}
.next-module.show { display: block; }
.next-module:active { transform: translateX(-50%) scale(.97); }
body.finished .message { padding-bottom: 55px; }

</style>
</head>
<body>
<main class="scene">


  <section class="content">
    <div class="intro">
      <h1 id="heading">Pop all 4 balloons</h1>
      <p class="subtitle">A tiny surprise is hiding behind them ♡</p>
    </div>

    <div class="balloon-area">
      <div class="message" aria-live="polite">
        <span id="word1">You</span>
        <span id="word2">are so</span>
        <span id="word3">special</span>
      </div>

      <button class="balloon" aria-label="Pop balloon 1"><i class="string"></i></button>
      <button class="balloon" aria-label="Pop balloon 2"><i class="string"></i></button>
      <button class="balloon" aria-label="Pop balloon 3"><i class="string"></i></button>
      <button class="balloon" aria-label="Pop balloon 4"><i class="string"></i></button>
    </div>
  </section>
</main>
<button class="next-module" id="nextModule" type="button" onclick="window.location.href='modulee3.html'">Continue to the birthday wish →</button>
<script>
const balloons = [...document.querySelectorAll(".balloon")];
const words = [
  document.getElementById("word1"),
  document.getElementById("word2"),
  document.getElementById("word3")
];

let popped = 0;

balloons.forEach((balloon) => {
  balloon.addEventListener("click", () => {
    if (balloon.classList.contains("popped")) return;

    balloon.classList.add("popped");
    popped++;

    // Reveal the message as balloons pop.
    if (popped === 1) words[0].classList.add("revealed");
    if (popped === 2) words[1].classList.add("revealed");
    if (popped === 3) words[2].classList.add("revealed");

    if (popped === balloons.length) {
      // Show the final message, then let Mahii continue to Module 3.
      document.body.classList.add("finished");
      window.setTimeout(() => {
        document.getElementById("nextModule").classList.add("show");
      }, 500);
    }
  });
});
</script>
</body>
</html>
